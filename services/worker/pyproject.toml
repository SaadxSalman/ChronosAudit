[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosaudit-worker"
version = "1.0.0"
description = "Temporal Knowledge-Graph RAG worker: PDF ingestion, extraction SLM, LanceDB + NetworkX retrieval"
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saad Salman" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "reportlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chronos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::.*pydantic.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]