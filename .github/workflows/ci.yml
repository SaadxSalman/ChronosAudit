name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: Python worker (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r services/worker/requirements.txt
      - name: Run tests
        working-directory: services/worker
        run: python -m pytest tests -v
      - name: Import smoke-test
        working-directory: services/worker
        run: python -c "from chronos.api import app; from chronos import celery_app; print('imports OK')"

  api:
    name: Express API (build + node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Install dependencies
        working-directory: services/api
        run: npm ci || npm install
      - name: Type-check
        working-directory: services/api
        run: npm run typecheck
      - name: Build
        working-directory: services/api
        run: npm run build
      - name: Test
        working-directory: services/api
        run: npm test

  docs:
    name: README & links sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README length & presence of key sections
        run: |
          test -f README.md
          test "$(wc -l < README.md)" -gt 400
          grep -q "Quickstart" README.md
          grep -q "Temporal" README.md